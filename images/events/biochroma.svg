<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- Subtle border accent -->
  <rect x="16" y="16" width="768" height="448" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(48, 48)">
    <rect width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#A78BFA" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#A78BFA" letter-spacing="1.5">CULTURAL & DESIGN</text>
  </g>

  <g transform="translate(620, 48)">
    <text x="132" y="19" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B">ARENIUM'27</text>
  </g>

  <!-- Event Artwork -->
  
        <!-- Tech & Organic Botanical Synthesis -->
        <path d="M400,125 C420,165 440,210 440,245 C440,265 420,275 400,275 C380,275 360,265 360,245 C360,210 380,165 400,125 Z" fill="rgba(167, 139, 250, 0.12)" stroke="#A78BFA" stroke-width="3"/>
        <!-- Center Leaf Vein / Circuit Spine -->
        <line x1="400" y1="135" x2="400" y2="265" stroke="#34D399" stroke-width="2.5"/>
        <line x1="400" y1="170" x2="425" y2="155" stroke="#A78BFA" stroke-width="2"/>
        <line x1="400" y1="195" x2="375" y2="180" stroke="#A78BFA" stroke-width="2"/>
        <line x1="400" y1="220" x2="425" y2="205" stroke="#A78BFA" stroke-width="2"/>
        <line x1="400" y1="245" x2="375" y2="230" stroke="#A78BFA" stroke-width="2"/>
        <circle cx="425" cy="155" r="3.5" fill="#38BDF8"/>
        <circle cx="375" cy="180" r="3.5" fill="#38BDF8"/>
        <circle cx="425" cy="205" r="3.5" fill="#38BDF8"/>
        <circle cx="375" cy="230" r="3.5" fill="#38BDF8"/>
        

  <!-- Typography Content -->
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">BIOCHROMA</text>
  <text x="400" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94A3B8">Tech-Fashion Runway Showcase</text>
