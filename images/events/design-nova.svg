<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- Subtle border accent -->
  <rect x="16" y="16" width="768" height="448" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(48, 48)">
    <rect width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#F472B6" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#F472B6" letter-spacing="1.5">TECHNICAL EVENT</text>
  </g>

  <g transform="translate(620, 48)">
    <text x="132" y="19" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B">ARENIUM'27</text>
  </g>

  <!-- Event Artwork -->
  
        <!-- Design Artboard & Pen Tool -->
        <rect x="310" y="130" width="120" height="135" rx="8" fill="rgba(244, 114, 182, 0.08)" stroke="#F472B6" stroke-width="2.5"/>
        <rect x="330" y="150" width="80" height="30" rx="4" fill="rgba(244, 114, 182, 0.2)"/>
        <circle cx="345" cy="200" r="10" fill="#F472B6"/>
        <rect x="365" y="195" width="45" height="10" rx="3" fill="#CBD5E1"/>
        <rect x="330" y="225" width="80" height="20" rx="4" fill="#38BDF8"/>
        <!-- Vector Pen Tool -->
        <polygon points="450,150 480,180 440,220 420,210" fill="#F472B6" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="430" cy="215" r="3" fill="#0F172A"/>
        <path d="M480,180 L495,195" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
        

  <!-- Typography Content -->
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">DESIGNNOVA</text>
  <text x="400" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94A3B8">UI/UX Design Sprint & Prototyping</text>
</svg>