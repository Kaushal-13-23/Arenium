<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- Subtle border accent -->
  <rect x="16" y="16" width="768" height="448" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(48, 48)">
    <rect width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#60A5FA" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#60A5FA" letter-spacing="1.5">TECHNICAL EVENT</text>
  </g>

  <g transform="translate(620, 48)">
    <text x="132" y="19" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B">ARENIUM'27</text>
  </g>

  <!-- Event Artwork -->
  
        <!-- Dark Monitor / Blind Coding Icon -->
        <rect x="310" y="130" width="180" height="120" rx="10" fill="#090D16" stroke="#60A5FA" stroke-width="3"/>
        <line x1="370" y1="250" x2="430" y2="250" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
        <line x1="400" y1="250" x2="400" y2="275" stroke="#60A5FA" stroke-width="6"/>
        <line x1="360" y1="275" x2="440" y2="275" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
        <!-- Code Cursor and Blindfold slash -->
        <text x="330" y="170" fill="#38BDF8" font-family="monospace" font-size="16">&gt;_</text>
        <path d="M350,200 C370,180 430,180 450,200" stroke="#94A3B8" stroke-width="3" fill="none"/>
        <circle cx="400" cy="195" r="8" fill="#60A5FA"/>
        <line x1="340" y1="225" x2="460" y2="165" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
        

  <!-- Typography Content -->
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">SHADOWCODE</text>
  <text x="400" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94A3B8">Blindfold Competitive Programming</text>
</svg>