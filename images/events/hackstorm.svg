<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- Subtle border accent -->
  <rect x="16" y="16" width="768" height="448" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(48, 48)">
    <rect width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="1.5">FLAGSHIP HACKATHON</text>
  </g>

  <g transform="translate(620, 48)">
    <text x="132" y="19" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B">ARENIUM'27</text>
  </g>

  <!-- Event Artwork -->
  
        <!-- 24H Badge & Coding Sprint -->
        <circle cx="400" cy="200" r="75" fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="3"/>
        <!-- Clock Marks & 24H Symbol -->
        <path d="M400,135 L400,150" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
        <path d="M465,200 L450,200" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
        <path d="M400,265 L400,250" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
        <path d="M335,200 L350,200" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
        <!-- Center 24H typography -->
        <text x="400" y="210" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="36" fill="#FFFFFF">24H</text>
        <text x="400" y="235" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#38BDF8" letter-spacing="3">SPRINT</text>
        

  <!-- Typography Content -->
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">HACKSTORM</text>
  <text x="400" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94A3B8">24-Hour National Flagship Hackathon</text>
</svg>