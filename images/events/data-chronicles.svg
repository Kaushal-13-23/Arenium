<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- Subtle border accent -->
  <rect x="16" y="16" width="768" height="448" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(48, 48)">
    <rect width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#34D399" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#34D399" letter-spacing="1.5">TECHNICAL EVENT</text>
  </g>

  <g transform="translate(620, 48)">
    <text x="132" y="19" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B">ARENIUM'27</text>
  </g>

  <!-- Event Artwork -->
  
        <!-- Analytics & Neural Cluster -->
        <line x1="320" y1="260" x2="480" y2="260" stroke="#64748B" stroke-width="2"/>
        <rect x="335" y="190" width="24" height="70" rx="3" fill="#34D399"/>
        <rect x="375" y="160" width="24" height="100" rx="3" fill="#38BDF8"/>
        <rect x="415" y="130" width="24" height="130" rx="3" fill="#818CF8"/>
        <rect x="455" y="175" width="24" height="85" rx="3" fill="#F472B6"/>
        <!-- Connected Trend Line -->
        <polyline points="347,180 387,150 427,120 467,165" fill="none" stroke="#FBBF24" stroke-width="3"/>
        <circle cx="347" cy="180" r="5" fill="#FBBF24"/>
        <circle cx="387" cy="150" r="5" fill="#FBBF24"/>
        <circle cx="427" cy="120" r="5" fill="#FBBF24"/>
        <circle cx="467" cy="165" r="5" fill="#FBBF24"/>
        

  <!-- Typography Content -->
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">DATACHRONICLES</text>
  <text x="400" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94A3B8">Data Science & Machine Learning</text>
</svg>